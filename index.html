<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>রিখিয়ার মজার খেলা</title>
<style>
  :root{
    --bg-sky-top:#BFE9FF;
    --bg-sky-bottom:#FFF4D6;
    --grass:#3FA34D;
    --grass-dark:#2C7A37;
    --berry:#FF6FA0;
    --berry-dark:#D94A7C;
    --sun:#FFC94A;
    --sun-dark:#F0A400;
    --ink:#3B2352;
    --ink-soft:#6B5480;
    --surface:#FFFFFF;
    --stage-mat:#FFE9B8;
    --stage-mat-line:#F7D583;
    --card-back-1:#7C5CD9;
    --card-back-2:#5E3FBE;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-sky-top:#16213E;
      --bg-sky-bottom:#2A1B3D;
      --grass:#276B3E;
      --grass-dark:#1B4E2C;
      --berry:#E85C93;
      --berry-dark:#B93E6E;
      --sun:#F2B93E;
      --sun-dark:#D69B22;
      --ink:#F3E9FF;
      --ink-soft:#C6B6E0;
      --surface:#241A38;
      --stage-mat:#3A2B55;
      --stage-mat-line:#4C3A70;
      --card-back-1:#8F72E8;
      --card-back-2:#6247C4;
    }
  }
  :root[data-theme="dark"]{
    --bg-sky-top:#16213E;
    --bg-sky-bottom:#2A1B3D;
    --grass:#276B3E;
    --grass-dark:#1B4E2C;
    --berry:#E85C93;
    --berry-dark:#B93E6E;
    --sun:#F2B93E;
    --sun-dark:#D69B22;
    --ink:#F3E9FF;
    --ink-soft:#C6B6E0;
    --surface:#241A38;
    --stage-mat:#3A2B55;
    --stage-mat-line:#4C3A70;
    --card-back-1:#8F72E8;
    --card-back-2:#6247C4;
  }
  html,body{ height:100%; }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100%;
    background:linear-gradient(180deg,var(--bg-sky-top) 0%,var(--bg-sky-bottom) 78%);
    font-family:'Noto Sans Bengali','Nirmala UI','Vrinda','Kohinoor Bangla','Siyam Rupali',system-ui,sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:28px 16px calc(28px + env(safe-area-inset-bottom,0px));
    overflow-x:hidden;
  }
  .page{ width:100%; max-width:860px; position:relative; }

  .sun{
    position:absolute; top:-18px; right:6px; width:74px; height:74px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--sun), var(--sun-dark));
    box-shadow:0 0 0 10px color-mix(in srgb, var(--sun) 25%, transparent);
    z-index:0;
  }
  .cloud{ position:absolute; background:var(--surface); opacity:.75; border-radius:50px; z-index:0; }
  .cloud.c1{ width:90px; height:28px; top:6px; left:-10px; }
  .cloud.c2{ width:60px; height:20px; top:34px; left:40px; opacity:.55; }

  header{ position:relative; z-index:1; text-align:center; margin-bottom:18px; }
  h1{
    margin:0 0 6px;
    font-weight:800;
    font-size:clamp(1.7rem, 6vw, 2.5rem);
    letter-spacing:.2px;
  }
  header p{
    margin:0 auto; max-width:46ch;
    font-weight:500;
    font-size:clamp(.92rem, 3vw, 1.08rem);
    color:var(--ink-soft);
    line-height:1.5;
  }

  .status{
    text-align:center;
    min-height:1.6em;
    margin:14px 0 10px;
    font-weight:700;
    font-size:clamp(1rem, 3.4vw, 1.2rem);
    color:var(--ink);
  }

  .stage-wrap{
    position:relative; z-index:1;
    background:var(--stage-mat);
    border-radius:28px;
    padding:14px;
    box-shadow:0 10px 0 rgba(0,0,0,.06), 0 14px 30px rgba(0,0,0,.12);
    background-image:repeating-linear-gradient(45deg, var(--stage-mat-line) 0 2px, transparent 2px 22px);
  }
  .stage{
    position:relative;
    height:clamp(280px, 62vw, 460px);
    background:color-mix(in srgb, var(--stage-mat) 60%, var(--surface) 40%);
    border-radius:20px;
    overflow:visible;
  }
  .stage.clickable .card{ cursor:pointer; }
  .stage.clickable .card .card-inner{ animation:invite 1.4s ease-in-out infinite; }
  @keyframes invite{
    0%,100%{ filter:drop-shadow(0 0 0 transparent); }
    50%{ filter:drop-shadow(0 0 10px color-mix(in srgb, var(--sun) 70%, transparent)); }
  }

  .card{
    position:absolute;
    width:var(--card-w, 84px);
    height:var(--card-h, 118px);
    transition:left .65s cubic-bezier(.5,-0.2,.4,1.3), top .65s cubic-bezier(.5,-0.2,.4,1.3), transform .5s ease;
  }
  .card-inner{
    position:relative; width:100%; height:100%;
    transform-origin:center;
    transition:transform .16s ease;
  }
  .card-inner.squish{ transform:scaleX(0.05); }
  .card-face{
    position:absolute; inset:0;
    border-radius:16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    box-shadow:0 5px 0 rgba(0,0,0,.12), 0 8px 14px rgba(0,0,0,.14);
    border:3px solid rgba(255,255,255,.55);
  }
  .card-face.hidden-face{ display:none; }
  .card-front{ background:var(--fruit-grad, linear-gradient(160deg,#eee,#ccc)); }
  .card-front .emoji{ font-size:clamp(1.7rem, 6vw, 2.5rem); line-height:1; }
  .card-front .fname{
    font-weight:700; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.25);
    font-size:clamp(.72rem, 2.6vw, .92rem);
  }
  .card-back{ background:radial-gradient(circle at 30% 25%, var(--card-back-1), var(--card-back-2)); }
  .card-back .q{ font-size:clamp(1.6rem, 5.5vw, 2.3rem); color:#fff; opacity:.9; font-weight:800; }

  .confetti{
    position:absolute; left:0; top:0; pointer-events:none;
    font-size:1.25rem;
    animation:confetti-pop .9s ease-out forwards;
    z-index:5;
  }
  @keyframes confetti-pop{
    0%{ transform:translate(-50%,-50%) scale(.4) rotate(0deg); opacity:1; }
    100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(160deg); opacity:0; }
  }

  .controls{
    position:relative; z-index:1;
    display:flex; justify-content:center; gap:14px;
    margin:22px 0 6px; flex-wrap:wrap;
  }
  .btn{
    appearance:none; border:none; cursor:pointer;
    font-family:inherit; font-weight:700; font-size:clamp(1rem, 3.2vw, 1.12rem);
    color:#fff; padding:14px 26px; border-radius:999px;
    transition:transform .12s ease, box-shadow .12s ease, opacity .2s ease;
  }
  .btn:active{ transform:translateY(4px); }
  .btn-play{ background:var(--grass); box-shadow:0 6px 0 var(--grass-dark); }
  .btn-play:active{ box-shadow:0 2px 0 var(--grass-dark); }
  .btn-reset{ background:var(--berry); box-shadow:0 6px 0 var(--berry-dark); }
  .btn-reset:active{ box-shadow:0 2px 0 var(--berry-dark); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; box-shadow:none; transform:none; }
  .btn[hidden]{ display:none; }

  .result{
    position:relative; z-index:1;
    max-width:420px; margin:18px auto 0;
    background:var(--surface);
    border-radius:20px;
    padding:16px 20px;
    text-align:center;
    font-weight:700;
    font-size:clamp(1.05rem, 3.6vw, 1.3rem);
    box-shadow:0 8px 0 rgba(0,0,0,.05), 0 10px 24px rgba(0,0,0,.12);
  }
  .result[hidden]{ display:none; }
  .result .big{ font-size:clamp(2.2rem, 9vw, 3rem); display:block; margin-bottom:4px; }

  footer{
    position:relative; z-index:1;
    text-align:center; margin-top:22px;
    font-size:.85rem; color:var(--ink-soft); font-weight:500;
  }

  @media (prefers-reduced-motion: reduce){
    .card, .card-inner, .confetti{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="sun" aria-hidden="true"></div>
  <div class="cloud c1" aria-hidden="true"></div>
  <div class="cloud c2" aria-hidden="true"></div>

  <header>
    <h1>রিখিয়ার মজার খেলা</h1>
    <p>পাঁচটি ফল ভালো করে দেখে নাও, তারপর নিচের বোতামে চাপ দাও — ফলগুলো উল্টে গিয়ে ঘুরতে থাকবে, থামলে একটা কার্ড বেছে নাও।</p>
  </header>

  <p class="status" id="status" aria-live="polite">খেলা শুরু করতে নিচের বোতামে চাপ দাও</p>

  <div class="stage-wrap">
    <div class="stage" id="stage" role="group" aria-label="ফলের কার্ডসমূহ"></div>
  </div>

  <div class="controls">
    <button class="btn btn-play" id="playBtn">▶️ খেলা শুরু করো</button>
    <button class="btn btn-reset" id="resetBtn" hidden>🔄 আবার খেলো</button>
  </div>

  <div class="result" id="result" hidden aria-live="polite">
    <span class="big" id="resultEmoji">🍇</span>
    <span id="resultText">এটি হলো আঙ্গুর!</span>
  </div>

  <footer>ছোট্ট বন্ধুদের জন্য তৈরি 💛 · সম্পূর্ণ অফলাইনে খেলা যায়</footer>
</div>

<script>
(function(){
  "use strict";

  var fruits = [
    { name:"আঙ্গুর",  emoji:"🍇", c1:"#9B6BE0", c2:"#6C3FBF" },
    { name:"আপেল",    emoji:"🍎", c1:"#FF7A7A", c2:"#E5484D" },
    { name:"কমলা",    emoji:"🍊", c1:"#FFAE5C", c2:"#F5820E" },
    { name:"তরমুজ",   emoji:"🍉", c1:"#63D084", c2:"#2FA45A" },
    { name:"আনারস",   emoji:"🍍", c1:"#FFDE59", c2:"#F2B705" }
  ];

  var stage    = document.getElementById('stage');
  var playBtn  = document.getElementById('playBtn');
  var resetBtn = document.getElementById('resetBtn');
  var statusEl = document.getElementById('status');
  var resultEl = document.getElementById('result');
  var resultEmoji = document.getElementById('resultEmoji');
  var resultText  = document.getElementById('resultText');

  var state = 'idle'; // idle | shuffling | waiting | revealed
  var shuffleTimer = null;
  var stopTimer = null;
  var audioCtx = null;
  var cards = [];

  var DEFAULT_STATUS = 'খেলা শুরু করতে নিচের বোতামে চাপ দাও';

  function buildCards(){
    stage.innerHTML = '';
    cards = fruits.map(function(fruit, i){
      var card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = i;
      card.tabIndex = 0;
      card.setAttribute('role','button');
      card.setAttribute('aria-label', 'কার্ড ' + (i+1));

      var inner = document.createElement('div');
      inner.className = 'card-inner';

      var front = document.createElement('div');
      front.className = 'card-face card-front';
      front.style.setProperty('--fruit-grad', 'linear-gradient(160deg,' + fruit.c1 + ',' + fruit.c2 + ')');
      front.innerHTML = '<span class="emoji" aria-hidden="true">' + fruit.emoji + '</span><span class="fname">' + fruit.name + '</span>';

      var back = document.createElement('div');
      back.className = 'card-face card-back hidden-face';
      back.innerHTML = '<span class="q" aria-hidden="true">❓</span>';

      inner.appendChild(front);
      inner.appendChild(back);
      card.appendChild(inner);
      stage.appendChild(card);
      return card;
    });
    sizeCards();
  }

  function sizeCards(){
    var w = stage.clientWidth || 320;
    var cardW = Math.max(64, Math.min(140, w / 5 - 16));
    var cardH = cardW * 1.4;
    cards.forEach(function(c){
      c.style.setProperty('--card-w', cardW + 'px');
      c.style.setProperty('--card-h', cardH + 'px');
    });
  }

  function shuffledIndices(n){
    var arr = [];
    for(var i=0;i<n;i++) arr.push(i);
    for(var i=arr.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function positionRow(order){
    sizeCards();
    var w = stage.clientWidth, h = stage.clientHeight;
    var n = cards.length;
    if(!cards.length) return;
    var cardW = cards[0].offsetWidth, cardH = cards[0].offsetHeight;
    var gap = Math.max(6, (w - n*cardW) / (n+1));
    var seq = order || cards.map(function(_,i){ return i; });
    seq.forEach(function(cardIndex, slot){
      var c = cards[cardIndex];
      var x = gap + slot*(cardW+gap);
      var y = (h - cardH)/2;
      c.style.left = x + 'px';
      c.style.top = y + 'px';
      c.style.transform = 'rotate(0deg)';
    });
  }

  function positionRandom(){
    var w = stage.clientWidth, h = stage.clientHeight;
    cards.forEach(function(c){
      var cardW = c.offsetWidth, cardH = c.offsetHeight;
      var maxX = Math.max(0, w - cardW);
      var maxY = Math.max(0, h - cardH);
      var x = Math.random()*maxX;
      var y = Math.random()*maxY;
      var rot = (Math.random()*30 - 15).toFixed(1);
      c.style.left = x + 'px';
      c.style.top = y + 'px';
      c.style.transform = 'rotate(' + rot + 'deg)';
    });
  }

  function setFace(cardEl, face, instant){
    var front = cardEl.querySelector('.card-front');
    var back  = cardEl.querySelector('.card-back');
    var inner = cardEl.querySelector('.card-inner');
    function apply(){
      if(face === 'front'){ front.classList.remove('hidden-face'); back.classList.add('hidden-face'); }
      else { back.classList.remove('hidden-face'); front.classList.add('hidden-face'); }
    }
    if(instant){ apply(); return; }
    inner.classList.add('squish');
    setTimeout(function(){
      apply();
      inner.classList.remove('squish');
    }, 150);
  }

  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    } else if(audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
  }

  function playTone(){
    if(!audioCtx) return;
    var now = audioCtx.currentTime;
    var notes = [523.25, 659.25, 783.99];
    notes.forEach(function(freq, i){
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      var start = now + i*0.12;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.28, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.4);
    });
  }

  function spawnConfetti(cardEl){
    var rect = cardEl.getBoundingClientRect();
    var stageRect = stage.getBoundingClientRect();
    var originX = rect.left - stageRect.left + rect.width/2;
    var originY = rect.top - stageRect.top + rect.height/2;
    var glyphs = ['✨','🎉','⭐','💫'];
    for(var i=0;i<14;i++){
      var p = document.createElement('span');
      p.className = 'confetti';
      p.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
      var angle = Math.random()*2*Math.PI;
      var dist = 55 + Math.random()*70;
      var dx = Math.cos(angle)*dist;
      var dy = Math.sin(angle)*dist - 25;
      p.style.left = originX + 'px';
      p.style.top = originY + 'px';
      p.style.setProperty('--dx', dx + 'px');
      p.style.setProperty('--dy', dy + 'px');
      stage.appendChild(p);
      p.addEventListener('animationend', function(){ this.remove(); });
    }
  }

  function setStatus(text){ statusEl.textContent = text; }

  function startRound(){
    if(state !== 'idle') return;
    ensureAudio();
    state = 'shuffling';
    playBtn.disabled = true;
    resetBtn.hidden = false;
    resultEl.hidden = true;
    setStatus('ফলগুলো লুকিয়ে ঘুরছে... 👀');

    cards.forEach(function(c){ setFace(c, 'back'); });

    setTimeout(function(){
      positionRandom();
      shuffleTimer = setInterval(positionRandom, 700);
      stopTimer = setTimeout(function(){
        clearInterval(shuffleTimer);
        positionRow(shuffledIndices(cards.length));
        state = 'waiting';
        stage.classList.add('clickable');
        setStatus('এখন একটা কার্ড বেছে নাও! 👆');
      }, 8000);
    }, 350);
  }

  function pickCard(cardEl){
    if(state !== 'waiting') return;
    state = 'revealed';
    stage.classList.remove('clickable');
    setFace(cardEl, 'front');
    playTone();
    spawnConfetti(cardEl);

    var idx = +cardEl.dataset.index;
    var fruit = fruits[idx];
    cardEl.setAttribute('aria-label', fruit.name);
    resultEmoji.textContent = fruit.emoji;
    resultText.textContent = 'এটি হলো ' + fruit.name + '!';
    resultEl.hidden = false;
    setStatus('সাবাশ! 🎉');
  }

  function resetGame(){
    clearInterval(shuffleTimer);
    clearTimeout(stopTimer);
    state = 'idle';
    stage.classList.remove('clickable');
    cards.forEach(function(c,i){
      setFace(c, 'front', true);
      c.setAttribute('aria-label', 'কার্ড ' + (i+1));
    });
    resultEl.hidden = true;
    playBtn.disabled = false;
    positionRow();
    setStatus(DEFAULT_STATUS);
  }

  stage.addEventListener('click', function(e){
    var cardEl = e.target.closest('.card');
    if(cardEl) pickCard(cardEl);
  });
  stage.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    var cardEl = e.target.closest('.card');
    if(cardEl){ e.preventDefault(); pickCard(cardEl); }
  });

  playBtn.addEventListener('click', startRound);
  resetBtn.addEventListener('click', resetGame);

  window.addEventListener('resize', function(){
    if(state === 'idle') positionRow();
  });
  window.addEventListener('load', function(){
    buildCards();
    positionRow();
  });

  if(document.readyState === 'complete'){
    buildCards();
    positionRow();
  }
})();
</script>
</body>
</html>
